image: eclipse-temurin:17
stages:
  - test
  - build
  - deploy

variables:
  GRADLE_ARGS: --no-daemon --stacktrace --warning-mode=all
  DEBIAN_FRONTEND: noninteractive

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - apt-get update && apt-get install -y git

.tests:
  stage: test
  script:
    - ./gradlew ${GRADLE_ARGS} check

tests:jdk-17:
  extends: .tests

tests:jdk-21:
  extends: .tests
  image: eclipse-temurin:21

tests:jdk-25:
  extends: .tests
  image: eclipse-temurin:25

buildJar:
  stage: build
  script: ./gradlew ${GRADLE_OPTIONS} shadowJar
  artifacts:
    expire_in: 1 week
    paths:
      - build/libs

publish:
  stage: deploy
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle
    - apt-get update && apt-get install -y git

    - openssl aes-256-cbc -d -base64 -pbkdf2 -pass "env:ENCRYPTION_PASSWORD" -in gradle.properties.enc -out gradle.properties
    - openssl aes-256-cbc -d -base64 -pbkdf2 -pass "env:ENCRYPTION_PASSWORD" -in pubring.gpg.enc -out pubring.gpg
    - openssl aes-256-cbc -d -base64 -pbkdf2 -pass "env:ENCRYPTION_PASSWORD" -in secring.gpg.enc -out secring.gpg
  script:
    - ./gradlew ${GRADLE_OPTIONS} publish closeStagingRepositories
  only:
    - main@stups/prob/xml2b
    - develop@stups/prob/xml2b

deploy:snapshot:
  stage: deploy
  only:
    - develop@stups/prob/xml2b
  image: alpine:3
  before_script:
    - apk update
    - apk add lftp openssh-client
  script:
    - LFTP_PASSWORD="${DEPLOY_PASSWORD}" lftp -c "set cmd:fail-exit true; set sftp:auto-confirm true; open --user ${DEPLOY_USERNAME} --env-password sftp://${DEPLOY_HOST}/${DEPLOY_REMOTE_BASEDIR}/downloads/xml2b/snapshot/; mput -e build/libs/*.jar"

deploy:release:
  stage: deploy
  only:
    - main@stups/prob/xml2b
  image: alpine:3
  before_script:
    - apk update
    - apk add lftp openssh-client
  script:
    - LFTP_PASSWORD="${DEPLOY_PASSWORD}" lftp -c "set cmd:fail-exit true; set sftp:auto-confirm true; open --user ${DEPLOY_USERNAME} --env-password sftp://${DEPLOY_HOST}/${DEPLOY_REMOTE_BASEDIR}/downloads/xml2b/; mkdir -p release-next; cd release-next; mput build/libs/*.jar"
